<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' kmimg: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Kunstmuseum</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../../node_modules/cytoscape/dist/cytoscape.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Kunstmuseum</div>
    <div id="topbar-hint" class="topbar-hint muted small"></div>
    <div class="topbar-right">
      <button id="btn-tag-manager" class="btn">タグ管理</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <button id="btn-add-folder" class="btn primary block">＋ フォルダを追加</button>
        <label class="toggle sidebar-toggle"><input id="show-files" type="checkbox" checked> ファイルを表示</label>
      </div>
      <div id="tree" class="tree" tabindex="0"></div>
      <div class="sidebar-hint">エクスプローラーからフォルダをドロップして追加できます</div>
      <div class="sidebar-foot">
        <button id="btn-settings" class="btn subtle block settings-btn" title="設定">⚙ 設定</button>
      </div>
    </aside>
    <div class="resizer" data-resize="sidebar" title="ドラッグで幅を変更"></div>

    <main id="workbench" class="workbench"></main>

    <div class="resizer" data-resize="inspector" title="ドラッグで幅を変更"></div>
    <aside id="inspector" class="inspector"></aside>
  </div>

  <div id="ctx-menu" class="ctx-menu hidden"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
</body>
</html>
